<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Accept Equal World Shipping Admin Invitation</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#f5f7fb;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#172033}.card{width:min(460px,100%);background:#fff;border:1px solid #eaecf0;border-radius:20px;padding:30px;box-shadow:0 18px 55px #0001}.brand{color:#155eef;font-weight:800;margin-bottom:10px}.muted{color:#667085}form{display:grid;gap:14px;margin-top:20px}label{display:grid;gap:7px;font-weight:700;font-size:14px}input{padding:12px;border:1px solid #d0d5dd;border-radius:10px;font:inherit}button{border:0;border-radius:10px;padding:12px 16px;background:#155eef;color:#fff;font-weight:800;cursor:pointer}.msg{margin-top:14px;color:#475467}.error{color:#d92d20}.hidden{display:none}
</style>
</head>
<body>
<div class="card">
  <div class="brand">Equal World Shipping</div>
  <h1>Accept admin invitation</h1>
  <p class="muted">Create your separate admin password. You will then be able to sign in at the Admin Control Center.</p>
  <form id="inviteAcceptForm">
    <label>Password<input id="password" type="password" minlength="8" autocomplete="new-password" required></label>
    <label>Confirm password<input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required></label>
    <button type="submit">Create admin account</button>
  </form>
  <p id="result" class="msg"></p>
</div>
<script>
const API="https://ypedqbffumjwccqmgauo.supabase.co/functions/v1/equal-world-api-v2";
const token=new URLSearchParams(location.search).get("token")||"";
const form=document.getElementById("inviteAcceptForm"),result=document.getElementById("result");
form.addEventListener("submit",async e=>{
 e.preventDefault(); result.className="msg"; result.textContent="";
 const p=document.getElementById("password").value, c=document.getElementById("confirmPassword").value;
 if(p.length<8){result.className="msg error";result.textContent="Password must be at least 8 characters.";return}
 if(p!==c){result.className="msg error";result.textContent="Passwords do not match.";return}
 try{
  const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"accept_admin_invite",token,password:p})});
  const d=await r.json().catch(()=>({}));
  if(!r.ok||d.error)throw new Error(d.error||"Invitation could not be accepted.");
  result.textContent="Your admin account is ready. You can now sign in.";
  form.innerHTML='<button type="button" onclick="location.href=\'admin.html\'">Go to Admin Control Center</button>';
 }catch(x){result.className="msg error";result.textContent=x.message}
});
if(!token){form.classList.add("hidden");result.className="msg error";result.textContent="This invitation link is missing its invitation token."}
</script>
</body>
</html>
